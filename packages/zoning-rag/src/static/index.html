<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoning Policy Search Engine</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3344;
    --text: #e2e4e9;
    --text2: #8b8fa3;
    --accent: #6c8cf5;
    --accent-hover: #8fa8ff;
    --green: #3dd68c;
    --yellow: #f5c842;
    --orange: #f28b42;
    --red: #e5484d;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ---- header ---- */
  .header {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header .logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.3px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text2);
  }

  /* ---- search area ---- */
  .search-section {
    max-width: 760px;
    margin: 48px auto 0;
    padding: 0 20px;
    text-align: center;
  }
  .search-section h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.4px;
  }
  .search-section .desc {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 28px;
  }
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 14px 48px 14px 20px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,140,245,0.15);
  }
  .search-box input::placeholder {
    color: var(--text2);
  }
  .search-box .search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--text2);
    pointer-events: none;
  }
  .search-hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text2);
  }

  /* ---- example queries ---- */
  .examples {
    max-width: 760px;
    margin: 24px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .examples button {
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
  }
  .examples button:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
    background: var(--surface2);
  }

  /* ---- status / loading ---- */
  .status {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--text2);
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- results ---- */
  .results-container {
    max-width: 820px;
    margin: 32px auto 48px;
    padding: 0 20px;
  }
  .results-meta {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 14px;
    transition: border-color .15s;
  }
  .result-card:hover {
    border-color: #444;
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .result-rank {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    background: var(--surface2);
    padding: 3px 9px;
    border-radius: 4px;
  }
  .result-score {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 4px;
  }
  .score-high { background: rgba(61,214,140,0.12); color: var(--green); }
  .score-mid  { background: rgba(245,200,66,0.12); color: var(--yellow); }
  .score-low  { background: rgba(229,72,77,0.12);  color: var(--red); }
  .result-source {
    font-size: 12px;
    color: var(--text2);
    background: var(--surface2);
    padding: 3px 9px;
    border-radius: 4px;
  }
  .result-page {
    font-size: 12px;
    color: var(--accent);
    background: rgba(108,140,245,0.10);
    padding: 3px 9px;
    border-radius: 4px;
  }
  .result-table-badge {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--orange);
    padding: 3px 9px;
    border-radius: 4px;
  }
  .result-type-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 4px;
  }
  .type-page_text  { background: rgba(139,143,163,0.15); color: var(--text2); }
  .type-table_text { background: rgba(242,139,66,0.15);  color: var(--orange); }
  .result-table-type-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 4px;
    background: rgba(108,140,245,0.12);
    color: var(--accent);
  }
  .result-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .result-text em {
    font-style: normal;
    background: rgba(108,140,245,0.25);
    border-radius: 2px;
    padding: 0 2px;
    color: var(--accent-hover);
  }

  /* ---- empty / error ---- */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text2);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .error-msg {
    background: rgba(229,72,77,0.12);
    border: 1px solid rgba(229,72,77,0.3);
    color: var(--red);
    padding: 12px 18px;
    border-radius: var(--radius);
    font-size: 14px;
    text-align: center;
    margin: 16px auto;
    max-width: 560px;
  }

  /* ---- responsive ---- */
  @media (max-width: 600px) {
    .search-section { margin-top: 32px; }
    .search-section h1 { font-size: 22px; }
    .result-card { padding: 14px 16px; }
    .result-text { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <span class="logo">&#x1F3DB;</span>
  <div>
    <span class="logo">Zoning Policy Search</span>
    <span class="subtitle" style="margin-left:10px">Chicago Zoning Ordinance &amp; Policy Documents</span>
  </div>
</header>

<!-- Search -->
<section class="search-section">
  <h1>Search Zoning Policies</h1>
  <p class="desc">Semantic search over the Chicago Zoning Ordinance. Returns relevant passages with page numbers.</p>
  <div class="search-box">
    <input id="queryInput" type="text" placeholder='Try "RT-4 front setback" or "B3-1 allowed uses" ...' autofocus>
    <span class="search-icon">&#x1F50D;</span>
  </div>
  <p class="search-hint">Press <strong>Enter</strong> to search</p>
</section>

<!-- Example queries -->
<div class="examples" id="examples">
  <button data-q="RT4 floor area ratio">RT4 FAR</button>
  <button data-q="RS3 minimum lot area">RS3 min lot area</button>
  <button data-q="RT4 front setback 15 feet">RT4 front setback</button>
  <button data-q="B3-1 allowed uses table">B3-1 use table</button>
  <button data-q="non-accessory parking permitted special use">non-accessory parking</button>
  <button data-q="residential districts maximum height">residential max height</button>
  <button data-q="parking requirement dwelling unit">parking per dwelling</button>
  <button data-q="pedestrian street transparency requirement">pedestrian street transparency</button>
  <button data-q="C1-2 allowed uses table">C1-2 allowed uses</button>
  <button data-q="B1-1 parking standard">B1-1 parking</button>
  <button data-q="M1-2 allowed uses">M1-2 allowed uses</button>
  <button data-q="landscaping and screening parking lot">landscaping &amp; screening</button>
</div>

<!-- Status / Loading -->
<div class="status" id="status"></div>

<!-- Error -->
<div id="errorArea"></div>

<!-- Results -->
<div class="results-container" id="results"></div>

<script>
const input = document.getElementById('queryInput');
const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('errorArea');

// ---- score class ----
function scoreClass(score) {
  if (score >= 0.75) return 'score-high';
  if (score >= 0.60) return 'score-mid';
  return 'score-low';
}

// ---- highlight query terms in text ----
function highlight(text, query) {
  if (!query) return text;
  const words = query.split(/\s+/).filter(w => w.length > 2);
  if (words.length === 0) return text;
  const escaped = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const pattern = new RegExp(`\\b(${escaped.join('|')})\\b`, 'gi');
  return text.replace(pattern, '<em>$1</em>');
}

// ---- render results ----
function renderResults(data) {
  const { query, elapsed_sec, total_results, results } = data;

  if (!results || results.length === 0) {
    resultsEl.innerHTML = `<div class="empty-state">
      <div class="icon">&#x1F50D;</div>
      <div>No results found for <strong>"${escapeHtml(query)}"</strong></div>
      <div style="margin-top:4px;font-size:13px">Try a different query or check the example queries above.</div>
    </div>`;
    return;
  }

  let html = `<div class="results-meta">
    ${total_results} result${total_results !== 1 ? 's' : ''}
    for <strong>"${escapeHtml(query)}"</strong>
    <span style="margin-left:8px;font-size:12px">(${elapsed_sec}s)</span>
  </div>`;

  results.forEach(r => {
    const page = r.page_number ? `p.${r.page_number}` : '';
    const isTable = r.content_type === 'table_text';
    const typeLabel = isTable ? 'table_text' : 'page_text';
    const typeClass = isTable ? 'type-table_text' : 'type-page_text';
    const tableType = r.table_type ? escapeHtml(r.table_type) : '';
    html += `
      <div class="result-card">
        <div class="result-header">
          <span class="result-rank">#${r.rank}</span>
          <span class="result-score ${scoreClass(r.score)}">${r.score.toFixed(4)}</span>
          <span class="result-type-badge ${typeClass}">${typeLabel}</span>
          <span class="result-source">${escapeHtml(r.source_file)}</span>
          ${page ? `<span class="result-page">${escapeHtml(page)}</span>` : ''}
          ${isTable ? '<span class="result-table-badge">&#x1F4CA; Table</span>' : ''}
          ${tableType ? `<span class="result-table-type-badge">${tableType}</span>` : ''}
        </div>
        <div class="result-text">${highlight(escapeHtml(r.text), query)}</div>
      </div>`;
  });

  resultsEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- perform search ----
function doSearch(q) {
  q = q.trim();
  if (!q) return;

  // update input + URL
  input.value = q;
  const url = new URL(window.location);
  url.searchParams.set('q', q);
  window.history.pushState({}, '', url);

  // show loading
  statusEl.innerHTML = '<span class="spinner"></span> Searching ...';
  errorEl.innerHTML = '';
  resultsEl.innerHTML = '';

  fetch(`/api/query?q=${encodeURIComponent(q)}`)
    .then(res => res.json())
    .then(data => {
      statusEl.innerHTML = '';
      if (data.error) {
        errorEl.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
      } else {
        renderResults(data);
      }
    })
    .catch(err => {
      statusEl.innerHTML = '';
      errorEl.innerHTML = `<div class="error-msg">Request failed: ${escapeHtml(err.message)}</div>`;
    });
}

// ---- event listeners ----
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch(input.value);
});

document.getElementById('examples').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON' && e.target.dataset.q) {
    doSearch(e.target.dataset.q);
    input.scrollIntoView({ behavior: 'smooth' });
  }
});

// ---- restore query from URL on load ----
(function() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q) {
    input.value = q;
    doSearch(q);
  }
})();
</script>

</body>
</html>
